# Golden set: questions with the behaviour we expect. Run `python -m app.eval` after ANY change
# (prompts, models, chunking, thresholds, docs) and compare the score.
#
# expect:   answered | escalated | buddy | smalltalk
# source:   doc that must be among the CITED sources (answered only)
# contains: all must appear in the answer (case-insensitive)
# not:      none may appear in the answer
# lang:     sq | mk -> the answer must be in Albanian / Macedonian
# user:     users.yaml key to ask as (default: default)

# --- Answerable, English ---
- q: How do I connect to the VPN?
  expect: answered
  source: it-setup-vpn.md
  contains: [vpn.kestrel.example]
- q: whats the vpn address
  expect: answered
  source: it-setup-vpn.md
  contains: [vpn.kestrel.example]
- q: Where do I pick up my laptop on day one?
  expect: answered
  source: it-setup-vpn.md
  contains: [2nd floor]
- q: How many days of annual leave do I get?        # boundary: policy, not "MY contract"
  expect: answered
  source: leave-policy.md
  contains: ["25"]
- q: How do I book time off?
  expect: answered
  source: leave-policy.md
  contains: [Kestrel People]
- q: I'm sick today, what do I do?                    # boundary: sick leave process, not health
  expect: answered
  source: leave-policy.md
  contains: ["09:30"]
- q: Can I expense a new monitor for home?
  expect: answered
  source: expenses.md
  contains: ["300"]
- q: What does SOW mean?
  expect: answered
  source: glossary.md
  contains: [Statement of Work]
- q: What is an ICR and how do I raise one?
  expect: answered
  source: glossary.md
- q: Who do I talk to about a lost access badge?
  expect: answered
  source: office-logistics.md
  contains: [Sara]
- q: How does parking work at the office?
  expect: answered
  source: office-logistics.md
  contains: [Friday]
- q: What are the core hours?
  expect: answered
  source: employee-handbook.md
  contains: ["10:00"]
- q: How long is probation?                          # boundary: policy, not "did I pass"
  expect: answered
  source: employee-handbook.md
  contains: [three months]
- q: When do sprints start?
  expect: answered
  source: jira-conventions.md
  contains: [Wednesday]
- q: Where do I ask IT questions?
  expect: answered
  contains: ["#it-help"]

